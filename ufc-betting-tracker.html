<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFC Betting Tracker 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

/* ─── 60:30:10 BATMAN BEYOND ───────────────────
   60% → Deep charcoal / near-black  #0D0F14 #131720 #1A1F2E
   30% → Electric neon blue          #1B6BFF #2979FF #0A4FCC
   10% → Sharp red-orange accent     #FF3A2F #E8192C
──────────────────────────────────────────────── */
:root {
  /* 60% — dominant darks */
  --bg:      #0A0C10;
  --p1:      #0F1219;
  --p2:      #141824;
  --p3:      #1C2130;

  /* 30% — electric blue */
  --blue:    #1B6BFF;
  --blue2:   #4D8FFF;
  --blue3:   #0A3FA0;
  --blue-dim: rgba(27,107,255,0.12);
  --blue-glow: rgba(27,107,255,0.25);

  /* 10% — red-orange pop */
  --red:     #FF3A2F;
  --red2:    #FF5247;

  /* neutrals */
  --text:    #D8E0F0;
  --dim:     #3A4560;
  --border:  rgba(27,107,255,0.15);
  --border2: rgba(255,255,255,0.05);
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

/* ═══════════════════════
   HERO  (60% dark dominates)
═══════════════════════ */
.hero {
  background: var(--p1);
  position: relative;
  overflow: hidden;
  height: 130px;
  flex-shrink: 0;
}

/* Big blue slab — 30% moment */
.hero-blue {
  position: absolute;
  top: 0; left: 0;
  width: 200px; height: 130px;
  background: var(--blue);
  clip-path: polygon(0 0, 100% 0, 72% 100%, 0 100%);
}

/* Dark notch cuts into blue */
.hero-blue::after {
  content: '';
  position: absolute;
  top: 0; right: -1px;
  width: 0; height: 0;
  border-style: solid;
  border-width: 0 55px 55px 0;
  border-color: transparent var(--p1) transparent transparent;
}

/* Red accent slash — 10% pop */
.hero-red-slash {
  position: absolute;
  bottom: 0; left: 0;
  width: 220px; height: 3px;
  background: var(--red);
}

/* Scan-line texture — cyberpunk feel */
.hero-scan {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.12) 3px,
    rgba(0,0,0,0.12) 4px
  );
  z-index: 1; pointer-events: none;
}

/* Blue grid lines on dark side */
.hero-grid {
  position: absolute;
  top: 0; right: 0;
  width: 200px; height: 130px;
  background-image:
    linear-gradient(rgba(27,107,255,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(27,107,255,0.08) 1px, transparent 1px);
  background-size: 20px 20px;
  z-index: 0;
}

.hero-inner {
  position: relative; z-index: 3;
  padding: 18px 20px 0;
}

.eyebrow {
  font-size: 7.5px; font-weight: 500;
  letter-spacing: 0.4em; text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  margin-bottom: 2px;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 58px; line-height: 0.88;
  letter-spacing: 0.03em;
  color: #fff;
}

.logo-season {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 300;
  letter-spacing: 0.5em; text-transform: uppercase;
  color: var(--blue2);
  margin-top: 5px;
}

/* Blue glow line bottom of hero */
.hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1.5px;
  background: var(--blue);
  box-shadow: 0 0 12px var(--blue-glow);
  z-index: 4;
}

/* ═══════════════════════
   4 STAT CARDS  (30% blue panels)
═══════════════════════ */
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  background: var(--border);
  gap: 1px;
  border-bottom: 1px solid var(--border);
}

.card {
  background: var(--p2);
  padding: 10px 10px 9px;
  position: relative;
  overflow: hidden;
}

/* Blue top stripe — 30% */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1.5px;
  background: var(--blue);
}

/* Blue corner glow */
.card::after {
  content: '';
  position: absolute;
  top: -15px; left: -15px;
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--blue);
  opacity: 0.07;
}

/* Red accent on specific card — 10% */
.card.accent-red::before { background: var(--red); }
.card.accent-red::after  { background: var(--red); }

.cl {
  font-size: 6.5px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 3px;
}

.cv {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 19px; line-height: 1;
  letter-spacing: 0.01em;
}

.cv.blue  { color: var(--blue2); }
.cv.green { color: #00D4FF; }   /* cyan-green — still in blue family */
.cv.red   { color: var(--red); }
.cv.white { color: #fff; }

.cs {
  font-size: 7.5px; font-weight: 300;
  color: var(--dim);
  margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ═══════════════════════
   BANKROLL CHART
═══════════════════════ */
.chart-wrap {
  background: var(--p1);
  border-top: 1px solid var(--border2);
  border-bottom: 1px solid var(--border2);
  padding: 10px 14px 8px;
}

.chart-wrap svg {
  display: block;
  width: 100%;
  height: 120px;
}

/* ═══════════════════════
   ADD / EDIT BET FORM
═══════════════════════ */
.form-bar {
  padding: 10px 14px 0;
  display: flex; justify-content: flex-end;
}

.btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  border: none; cursor: pointer;
  padding: 8px 16px;
  color: #fff;
  background: var(--blue);
  transition: filter 0.15s;
}
.btn:hover { filter: brightness(1.15); }
.btn.ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--blue2);
}
.btn.danger { background: var(--red); }

.form-panel {
  margin: 10px 14px 0;
  background: var(--p2);
  border: 1px solid var(--border);
  border-top: 1.5px solid var(--blue);
  padding: 12px;
  display: none;
}
.form-panel.open { display: block; }

.form-title {
  font-size: 8px; font-weight: 600;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--blue2);
  margin-bottom: 10px;
}

.field { margin-bottom: 9px; }

.field label {
  display: block;
  font-size: 6.5px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 3px;
}

.field input {
  width: 100%;
  background: var(--p1);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 12px;
  padding: 7px 9px;
  outline: none;
}
.field input:focus { border-color: var(--blue); }

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.pnl-preview {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  margin: 2px 0 10px;
}
.pnl-preview .lbl {
  font-family: 'Barlow', sans-serif;
  font-size: 6.5px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--dim);
  margin-right: 6px;
}
.pnl-preview.p { color: var(--blue2); }
.pnl-preview.n { color: var(--red); }

.form-actions { display: flex; gap: 8px; }
.form-actions .spacer { flex: 1; }

.reset-link {
  font-size: 7px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--dim);
  background: none; border: none; cursor: pointer;
  margin-top: 10px;
  text-decoration: underline;
}
.reset-link:hover { color: var(--red); }

/* ═══════════════════════
   SECTION HEADERS
═══════════════════════ */
.sec-hd {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px 8px;
  background: var(--bg);
}

.sec-txt {
  font-size: 8px; font-weight: 600;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--blue2);
  white-space: nowrap;
}

.sec-line {
  flex: 1; height: 1px;
  background: var(--border);
}

/* ═══════════════════════
   BARS  (blue = profit, red = loss)
═══════════════════════ */
.bars-wrap {
  background: var(--p1);
  padding: 10px 14px;
  display: flex; flex-direction: column;
  gap: 5px;
}

.bar-row {
  display: grid;
  grid-template-columns: 14px 1fr 58px;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  border-radius: 2px;
  padding: 1px 2px;
  transition: background 0.15s;
}

.bar-row:hover, .bar-row.hot { background: var(--blue-dim); }

.bi {
  font-size: 8px;
  color: var(--dim);
  text-align: right;
  font-family: 'Barlow Condensed', sans-serif;
}

.bt {
  height: 5px;
  background: var(--p3);
  border-radius: 1px;
  position: relative; overflow: hidden;
}

.bf {
  position: absolute; left: 0; top: 0;
  height: 100%; border-radius: 1px;
  width: 0;
  transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}

/* 30% blue for profit bars */
.bf.p { background: var(--blue); }
/* 10% red for loss bars */
.bf.n { background: var(--red); }

.bamt {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 600;
  text-align: right;
}

.bamt.p { color: var(--blue2); }
.bamt.n { color: var(--red); }

/* ═══════════════════════
   TABLE
═══════════════════════ */
.tbl-wrap {
  background: var(--p1);
  display: flex; flex-direction: column;
}

.tbl-head {
  display: grid;
  grid-template-columns: 1fr 58px 58px 58px;
  padding: 7px 14px;
  background: var(--p2);
  border-bottom: 1px solid var(--border);
}

.th {
  font-size: 7px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--blue2);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: color 0.15s;
}

.th:hover { color: #fff; }
.th:not(:first-child) { text-align: right; }

.th .arr { font-size: 7px; color: var(--red); }

.tbl-body {
  display: flex; flex-direction: column;
}

.tr {
  display: grid;
  grid-template-columns: 1fr 58px 58px 58px;
  padding: 0 14px;
  align-items: center;
  position: relative;
  border-bottom: 1px solid rgba(27,107,255,0.07);
  min-height: 26px;
  animation: rowIn 0.3s ease both;
  transition: background 0.15s;
}

@keyframes rowIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.tr::before {
  content: '';
  position: absolute;
  left: 0; top: 18%; bottom: 18%;
  width: 1.5px;
}

/* Blue for profit — 30% */
.tr.pr::before { background: var(--blue); }
/* Red for loss — 10% */
.tr.ls::before { background: var(--red); }

.tr:nth-child(even) { background: rgba(27,107,255,0.04); }
.tr.hot { background: var(--blue-dim); }

.tr.tot {
  background: var(--p2);
  border-top: 1px solid var(--border);
  border-bottom: none;
  padding: 7px 14px;
  animation: none;
}
.tr.tot::before { display: none; }

.t-name {
  font-size: 10px; font-weight: 500;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 0 6px 0 5px;
}

.td {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; text-align: right;
}

.td.mu  { color: var(--dim); }
.td.pr  { color: var(--blue2); font-weight: 600; }
.td.ls  { color: var(--red);   font-weight: 600; }
.td.go  { color: #fff;         font-weight: 600; }
.td.tl  {
  font-size: 7px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--blue2); text-align: left;
}

/* ═══════════════════════
   FOOTER PIPS
═══════════════════════ */
.footer {
  background: var(--p2);
  border-top: 1px solid var(--border);
  padding: 10px 14px;
  display: flex; align-items: center;
  gap: 4px;
  margin-top: auto;
}

.pip-label {
  font-size: 6.5px; font-weight: 600;
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--blue2);
  margin-right: 4px;
  flex-shrink: 0;
}

.pips {
  display: flex; gap: 3px; align-items: center;
  flex-wrap: wrap;
  flex: 1;
}

.pip {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 8px; font-weight: 700; letter-spacing: 0;
  flex-shrink: 0;
}

/* Blue wins — 30% */
.pip.w { background: var(--blue); color: #fff; }
/* Red losses — 10% */
.pip.l { background: var(--red); color: #fff; }

.footer-roi {
  margin-left: auto;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  color: var(--blue2);
  flex-shrink: 0;
  align-self: flex-start;
}
</style>
</head>
<body>
<div class="page">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-blue"></div>
    <div class="hero-red-slash"></div>
    <div class="hero-scan"></div>
    <div class="hero-grid"></div>
    <div class="hero-inner">
      <div class="eyebrow">Betting Performance</div>
      <div class="logo">UFC<br>TRACKER</div>
      <div class="logo-season">2026 Season</div>
    </div>
  </div>

  <!-- CARDS -->
  <div class="cards">
    <div class="card">
      <div class="cl">Wagered</div>
      <div class="cv white" id="c1">—</div>
      <div class="cs" id="c1s">—</div>
    </div>
    <div class="card">
      <div class="cl">Net P&amp;L</div>
      <div class="cv" id="c2">—</div>
      <div class="cs" id="c2s">—</div>
    </div>
    <div class="card">
      <div class="cl">Record</div>
      <div class="cv blue" id="c3">—</div>
      <div class="cs" id="c3s">—</div>
    </div>
    <div class="card accent-red">
      <div class="cl">Best Win</div>
      <div class="cv blue" id="c4">—</div>
      <div class="cs" id="c4s">—</div>
    </div>
    <div class="card accent-red">
      <div class="cl">Worst Loss</div>
      <div class="cv red" id="c5">—</div>
      <div class="cs" id="c5s">—</div>
    </div>
    <div class="card">
      <div class="cl">Avg Bet</div>
      <div class="cv white" id="c6">—</div>
      <div class="cs" id="c6s">—</div>
    </div>
    <div class="card">
      <div class="cl">Streak</div>
      <div class="cv" id="c7">—</div>
      <div class="cs" id="c7s">—</div>
    </div>
    <div class="card">
      <div class="cl">Best Run</div>
      <div class="cv blue" id="c8">—</div>
      <div class="cs" id="c8s">—</div>
    </div>
  </div>

  <!-- BANKROLL CHART -->
  <div class="sec-hd">
    <div class="sec-txt">Cumulative Bankroll</div>
    <div class="sec-line"></div>
  </div>
  <div class="chart-wrap">
    <svg id="chart" viewBox="0 0 390 120" preserveAspectRatio="none"></svg>
  </div>

  <!-- ADD / EDIT BET -->
  <div class="form-bar">
    <button class="btn" id="toggle-form">+ Add Event</button>
  </div>
  <div class="form-panel" id="form-panel">
    <div class="form-title" id="form-title">Log a Bet</div>
    <div class="field">
      <label for="f-name">Event Name</label>
      <input id="f-name" type="text" placeholder="UFC 329 Jones vs Aspinall" autocomplete="off">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-bet">Total Bet ($)</label>
        <input id="f-bet" type="number" step="0.01" min="0" placeholder="250.00">
      </div>
      <div class="field">
        <label for="f-out">Withdrew ($)</label>
        <input id="f-out" type="number" step="0.01" min="0" placeholder="400.00">
      </div>
    </div>
    <div class="pnl-preview" id="pnl-preview"><span class="lbl">P&amp;L</span>—</div>
    <div class="form-actions">
      <button class="btn" id="f-save">Save</button>
      <button class="btn ghost" id="f-cancel">Cancel</button>
      <div class="spacer"></div>
      <button class="btn danger" id="f-delete" style="display:none">Delete</button>
    </div>
    <button class="reset-link" id="f-reset">Reset to original data</button>
  </div>

  <!-- BARS HEADER -->
  <div class="sec-hd">
    <div class="sec-txt">P&amp;L Per Event</div>
    <div class="sec-line"></div>
  </div>

  <!-- BARS -->
  <div class="bars-wrap" id="bars"></div>

  <!-- TABLE HEADER -->
  <div class="sec-hd">
    <div class="sec-txt">Full Event Log — tap a column to sort</div>
    <div class="sec-line"></div>
  </div>

  <!-- TABLE -->
  <div class="tbl-wrap">
    <div class="tbl-head" id="thead">
      <div class="th" data-k="i">Event <span class="arr" id="arr-i"></span></div>
      <div class="th" data-k="bet">Bet <span class="arr" id="arr-bet"></span></div>
      <div class="th" data-k="withdrew">Out <span class="arr" id="arr-withdrew"></span></div>
      <div class="th" data-k="pnl">P&amp;L <span class="arr" id="arr-pnl"></span></div>
    </div>
    <div class="tbl-body" id="tbody"></div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="pip-label">Results</div>
    <div class="pips" id="pips"></div>
    <div class="footer-roi" id="roi">—</div>
  </div>

</div>

<script>
const STORE_KEY = 'ufc-tracker-2026';

const SEED = [
  {name:"UFC 324",                     bet:144,    withdrew:200,     pnl:56},
  {name:"UFC 325",                     bet:212.71, withdrew:325,     pnl:112.29},
  {name:"FN Mario vs Vini",            bet:173.48, withdrew:546.77,  pnl:373.29},
  {name:"Strickland vs Fluffy",        bet:402.30, withdrew:90,      pnl:-312.30},
  {name:"Moreno vs Kavanagh",          bet:200,    withdrew:150,     pnl:-50},
  {name:"UFC 326 Max vs Charles",      bet:319.45, withdrew:305,     pnl:-14.45},
  {name:"FN Vallejos vs Emmett",       bet:352.99, withdrew:612,     pnl:259.01},
  {name:"London Mosvar vs Murphy",     bet:433.11, withdrew:586,     pnl:153},
  {name:"Seattle Izzy vs Pyfer",       bet:649.70, withdrew:220,     pnl:-429.70},
  {name:"Duncan vs Renato",            bet:541.76, withdrew:507,     pnl:-34.77},
  {name:"UFC 327 Jiri vs Carlos",      bet:719.52, withdrew:752.68,  pnl:33.16},
  {name:"Canada Burns vs Mallot",      bet:555.56, withdrew:825.91,  pnl:270.35},
  {name:"Vegas 116 Sterling vs Zalal", bet:587.53, withdrew:1036.69, pnl:449.16},
  {name:"Perth JDM vs Prates",         bet:663.41, withdrew:2055.43, pnl:1392.02},
  {name:"UFC 328 Strickland vs Khazmat", bet:693.21, withdrew:526, pnl:-167.21},
  {name:"FN Allen vs Costa",            bet:697.19, withdrew:844.23, pnl:147.04},
  {name:"Macau Figgy vs Song",          bet:341.01, withdrew:109.44, pnl:-231.57},
  {name:"FN Belal vs Bonfim",           bet:661.54, withdrew:275.88, pnl:-385.66},
];

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data)) return data;
    }
  } catch (e) {}
  return SEED.map(e => ({...e}));
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(E)); } catch (e) {}
}

let E = load();
E.forEach((e,i) => e.i = i);

const f = (n,p=false) => (n>=0?(p?'+':''):'-')+'$'+Math.abs(n).toFixed(2);

// Sort state: key + direction (null key = original order)
let sortK = 'i', sortDir = 1;

function stats() {
  const tBet = E.reduce((s,e)=>s+e.bet,0);
  const tOut = E.reduce((s,e)=>s+e.withdrew,0);
  const net  = E.reduce((s,e)=>s+e.pnl,0);
  const wins = E.filter(e=>e.pnl>0).length;
  return { tBet, tOut, net, wins, roi: net/tBet*100 };
}

function streaks() {
  let cur = 0, curWin = null, bestW = 0, bestL = 0, run = 0, runWin = null;
  E.forEach(e => {
    const w = e.pnl > 0;
    if (w === runWin) run++;
    else { run = 1; runWin = w; }
    if (w) bestW = Math.max(bestW, run);
    else   bestL = Math.max(bestL, run);
  });
  cur = run; curWin = runWin;
  return { cur, curWin, bestW, bestL };
}

function renderCards() {
  if (!E.length) {
    ['c1','c2','c3','c4','c5','c6','c7','c8','roi'].forEach(id => document.getElementById(id).textContent = '—');
    ['c1s','c2s','c3s','c4s','c5s','c6s','c7s','c8s'].forEach(id => document.getElementById(id).textContent = 'no events');
    return;
  }
  const { tBet, net, wins, roi } = stats();
  const bW = E.reduce((b,e)=>e.pnl>b.pnl?e:b,E[0]);
  const wL = E.reduce((b,e)=>e.pnl<b.pnl?e:b,E[0]);
  const sk = streaks();
  document.getElementById('c1').textContent  = '$'+tBet.toFixed(0);
  document.getElementById('c1s').textContent = E.length+' events';
  const c2 = document.getElementById('c2');
  c2.textContent = f(net,true);
  c2.className   = 'cv '+(net>=0?'green':'red');
  document.getElementById('c2s').textContent = 'ROI '+(roi>=0?'+':'')+roi.toFixed(1)+'%';
  document.getElementById('c3').textContent  = wins+' / '+(E.length-wins);
  document.getElementById('c3s').textContent = Math.round(wins/E.length*100)+'% win rate';
  document.getElementById('c4').textContent  = f(bW.pnl,true);
  document.getElementById('c4s').textContent = bW.name.split(' ').slice(0,3).join(' ');
  document.getElementById('c5').textContent  = f(wL.pnl,true);
  document.getElementById('c5s').textContent = wL.name.split(' ').slice(0,3).join(' ');
  document.getElementById('c6').textContent  = '$'+(tBet/E.length).toFixed(0);
  document.getElementById('c6s').textContent = 'per event';
  const c7 = document.getElementById('c7');
  c7.textContent = sk.cur+(sk.curWin?'W':'L');
  c7.className   = 'cv '+(sk.curWin?'blue':'red');
  document.getElementById('c7s').textContent = sk.curWin?'riding wins':'cold streak';
  document.getElementById('c8').textContent  = sk.bestW+'W';
  document.getElementById('c8s').textContent = 'worst run '+sk.bestL+'L';
  document.getElementById('roi').textContent = 'ROI '+(roi>=0?'+':'')+roi.toFixed(1)+'%';
}

function renderChart() {
  const svg = document.getElementById('chart');
  svg.innerHTML = '';
  if (!E.length) return;
  const W = 390, H = 120, padX = 6, padY = 10;
  // Cumulative P&L series, starting from 0
  const cum = [0];
  E.forEach(e => cum.push(cum[cum.length-1] + e.pnl));
  const mn = Math.min(...cum), mxv = Math.max(...cum);
  const span = (mxv - mn) || 1;
  const x = i => padX + i * (W - 2*padX) / (cum.length - 1 || 1);
  const y = v => padY + (mxv - v) * (H - 2*padY) / span;
  const pts = cum.map((v,i) => [x(i), y(v)]);
  const line = pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last = cum[cum.length-1];
  const ns = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs) => {
    const n = document.createElementNS(ns, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    svg.appendChild(n);
    return n;
  };
  // Gradient fill under the curve
  svg.innerHTML = `
    <defs>
      <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1B6BFF" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="#1B6BFF" stop-opacity="0"/>
      </linearGradient>
    </defs>`;
  el('polygon', {
    points: line+` ${pts[pts.length-1][0].toFixed(1)},${H-padY} ${pts[0][0].toFixed(1)},${H-padY}`,
    fill: 'url(#cg)'
  });
  // Zero baseline (dashed) when it falls inside the range
  if (mn < 0 && mxv > 0) {
    el('line', { x1: padX, x2: W-padX, y1: y(0), y2: y(0),
      stroke: 'rgba(216,224,240,0.25)', 'stroke-width': 0.75, 'stroke-dasharray': '3 3' });
  }
  el('polyline', { points: line, fill: 'none',
    stroke: last >= 0 ? '#1B6BFF' : '#FF3A2F', 'stroke-width': 1.75,
    'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
  // End dot + label
  const [ex, ey] = pts[pts.length-1];
  el('circle', { cx: ex, cy: ey, r: 3, fill: last >= 0 ? '#4D8FFF' : '#FF3A2F' });
  const lbl = el('text', {
    x: Math.min(ex, W-padX) - 4, y: ey < 20 ? ey+14 : ey-7,
    'text-anchor': 'end', fill: last >= 0 ? '#4D8FFF' : '#FF5247',
    'font-family': 'Barlow Condensed, sans-serif', 'font-size': '11', 'font-weight': '600'
  });
  lbl.textContent = f(last, true);
}

function renderBars() {
  const mx = Math.max(1, ...E.map(e=>Math.abs(e.pnl)));
  const bEl = document.getElementById('bars');
  bEl.innerHTML = '';
  E.forEach((e,i) => {
    const pct = (Math.abs(e.pnl)/mx*100).toFixed(1);
    const r = document.createElement('div');
    r.className = 'bar-row';
    r.dataset.i = e.i;
    r.innerHTML = `
      <div class="bi">${i+1}</div>
      <div class="bt"><div class="bf ${e.pnl>=0?'p':'n'}"></div></div>
      <div class="bamt ${e.pnl>=0?'p':'n'}">${f(e.pnl,true)}</div>`;
    r.addEventListener('click', () => highlight(e.i));
    bEl.appendChild(r);
    // Set width next frame so the CSS transition animates from 0
    requestAnimationFrame(() => requestAnimationFrame(() => {
      r.querySelector('.bf').style.width = pct+'%';
    }));
  });
}

function sorted() {
  const a = [...E];
  a.sort((x,y) => {
    const vx = sortK==='i' ? x.i : x[sortK];
    const vy = sortK==='i' ? y.i : y[sortK];
    return (vx-vy)*sortDir;
  });
  return a;
}

function renderTable() {
  const { tBet, tOut, net } = stats();
  const tb = document.getElementById('tbody');
  tb.innerHTML = '';
  sorted().forEach((e, idx) => {
    const r = document.createElement('div');
    r.className = 'tr '+(e.pnl>=0?'pr':'ls');
    r.dataset.i = e.i;
    r.style.animationDelay = (idx*0.015)+'s';
    r.innerHTML = `
      <div class="t-name">${e.name}</div>
      <div class="td mu">$${e.bet.toFixed(0)}</div>
      <div class="td mu">$${e.withdrew.toFixed(0)}</div>
      <div class="td ${e.pnl>=0?'pr':'ls'}">${f(e.pnl,true)}</div>`;
    r.addEventListener('click', () => openEdit(e.i));
    tb.appendChild(r);
  });
  const tot = document.createElement('div');
  tot.className = 'tr tot';
  tot.innerHTML = `
    <div class="td tl">Totals</div>
    <div class="td go">$${tBet.toFixed(0)}</div>
    <div class="td mu">$${tOut.toFixed(0)}</div>
    <div class="td ${net>=0?'pr':'ls'}">${f(net,true)}</div>`;
  tb.appendChild(tot);
}

function renderPips() {
  const pEl = document.getElementById('pips');
  pEl.innerHTML = '';
  E.forEach(e => {
    const d = document.createElement('div');
    d.className = 'pip '+(e.pnl>=0?'w':'l');
    d.textContent = e.pnl>=0?'W':'L';
    pEl.appendChild(d);
  });
}

// Tap a bar to flash its row in the table (and vice-versa context)
function highlight(i) {
  document.querySelectorAll('.hot').forEach(el => el.classList.remove('hot'));
  const row = document.querySelector(`.tr[data-i="${i}"]`);
  const bar = document.querySelector(`.bar-row[data-i="${i}"]`);
  if (row) {
    row.classList.add('hot');
    row.scrollIntoView({ behavior:'smooth', block:'center' });
  }
  if (bar) bar.classList.add('hot');
  setTimeout(() => {
    if (row) row.classList.remove('hot');
    if (bar) bar.classList.remove('hot');
  }, 1600);
}

// Sortable headers
document.getElementById('thead').addEventListener('click', ev => {
  const th = ev.target.closest('.th');
  if (!th) return;
  const k = th.dataset.k;
  if (sortK === k) sortDir *= -1;
  else { sortK = k; sortDir = k==='i' ? 1 : -1; }
  document.querySelectorAll('.arr').forEach(a => a.textContent = '');
  document.getElementById('arr-'+k).textContent = sortDir===1 ? '▲' : '▼';
  renderTable();
});

function renderAll() {
  renderCards();
  renderChart();
  renderBars();
  renderTable();
  renderPips();
}

/* ── Add / edit / delete ── */
const panel   = document.getElementById('form-panel');
const fName   = document.getElementById('f-name');
const fBet    = document.getElementById('f-bet');
const fOut    = document.getElementById('f-out');
const fDelete = document.getElementById('f-delete');
const fTitle  = document.getElementById('form-title');
const preview = document.getElementById('pnl-preview');
let editI = null;   // index being edited, or null when adding

function previewPnl() {
  const bet = parseFloat(fBet.value), out = parseFloat(fOut.value);
  if (isNaN(bet) || isNaN(out)) {
    preview.innerHTML = '<span class="lbl">P&L</span>—';
    preview.className = 'pnl-preview';
    return;
  }
  const pnl = out - bet;
  preview.innerHTML = '<span class="lbl">P&L</span>'+f(pnl,true);
  preview.className = 'pnl-preview '+(pnl>=0?'p':'n');
}
fBet.addEventListener('input', previewPnl);
fOut.addEventListener('input', previewPnl);

function openForm() {
  panel.classList.add('open');
  panel.scrollIntoView({ behavior:'smooth', block:'center' });
  fName.focus();
}

function closeForm() {
  panel.classList.remove('open');
  editI = null;
  fName.value = fBet.value = fOut.value = '';
  previewPnl();
}

function openAdd() {
  closeForm();
  fTitle.textContent = 'Log a Bet';
  fDelete.style.display = 'none';
  openForm();
}

function openEdit(i) {
  editI = i;
  const e = E[i];
  fTitle.textContent = 'Edit — '+e.name;
  fName.value = e.name;
  fBet.value  = e.bet;
  fOut.value  = e.withdrew;
  fDelete.style.display = '';
  previewPnl();
  openForm();
}

document.getElementById('toggle-form').addEventListener('click', () => {
  if (panel.classList.contains('open')) closeForm();
  else openAdd();
});

document.getElementById('f-cancel').addEventListener('click', closeForm);

document.getElementById('f-save').addEventListener('click', () => {
  const name = fName.value.trim();
  const bet  = parseFloat(fBet.value);
  const out  = parseFloat(fOut.value);
  if (!name || isNaN(bet) || isNaN(out) || bet < 0 || out < 0) {
    alert('Enter an event name plus valid bet and withdrew amounts.');
    return;
  }
  const rec = { name, bet, withdrew: out, pnl: +(out - bet).toFixed(2) };
  if (editI === null) E.push(rec);
  else E[editI] = { ...E[editI], ...rec };
  E.forEach((e,i) => e.i = i);
  save();
  closeForm();
  renderAll();
});

fDelete.addEventListener('click', () => {
  if (editI === null) return;
  if (!confirm('Delete "'+E[editI].name+'"?')) return;
  E.splice(editI, 1);
  E.forEach((e,i) => e.i = i);
  save();
  closeForm();
  renderAll();
});

document.getElementById('f-reset').addEventListener('click', () => {
  if (!confirm('Discard your changes and restore the original 18 events?')) return;
  E = SEED.map(e => ({...e}));
  E.forEach((e,i) => e.i = i);
  save();
  closeForm();
  renderAll();
});

renderAll();
</script>
